name: Backfill last winter

# Rebuilds historical IFS ENS runs (00Z + 12Z) with the same pipeline as the live job.
# One small job per day (2 runs, ~15–30 min), at most MAXPAR jobs at once so live runs stay fast.
# Runs already in data/backfill/runs are skipped, so re-running the same range only fills gaps.
# Output: data/backfill/runs/*.json + data/backfill/index.json. The live sheet does NOT read these.
#
# Start it either from Actions → Run workflow, or by pushing requests/backfill.txt containing
#   START END [MAXPAR]     e.g.  20251101 20260331 6

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date YYYYMMDD"
        required: true
        default: "20251101"
      end:
        description: "Last date YYYYMMDD"
        required: true
        default: "20260331"
      maxpar:
        description: "Jobs at once (keep ≤ 8 so the live run is not slowed)"
        required: true
        default: "6"
  push:
    paths: ["requests/backfill.txt"]

permissions:
  contents: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      days: ${{ steps.mk.outputs.days }}
      maxpar: ${{ steps.mk.outputs.maxpar }}
    steps:
      - uses: actions/checkout@v4
      - id: mk
        env:
          IN_START: ${{ github.event.inputs.start }}
          IN_END: ${{ github.event.inputs.end }}
          IN_MAXPAR: ${{ github.event.inputs.maxpar }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, timedelta
          s, e, m = os.environ.get("IN_START"), os.environ.get("IN_END"), os.environ.get("IN_MAXPAR")
          if not s:
              parts = open("requests/backfill.txt").read().split()
              s, e = parts[0], parts[1]
              m = parts[2] if len(parts) > 2 else "6"
          d, z = datetime.strptime(s, "%Y%m%d"), datetime.strptime(e, "%Y%m%d")
          have = set(os.listdir("data/backfill/runs")) if os.path.isdir("data/backfill/runs") else set()
          days = []
          while d <= z:
              tag = d.strftime("%Y%m%d")
              if not (tag + "00.json" in have and tag + "12.json" in have):
                  days.append(tag)
              d += timedelta(days=1)
          days = days[:250]
          print("days=" + json.dumps(days or ["none"]))
          print("maxpar=" + str(max(1, min(12, int(m or 6)))))
          EOF

  build:
    needs: plan
    if: needs.plan.outputs.days != '["none"]'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.maxpar) }}
      matrix:
        day: ${{ fromJSON(needs.plan.outputs.days) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build runs for ${{ matrix.day }}
        env:
          PYTHONUNBUFFERED: "1"
        run: python backfill.py --start ${{ matrix.day }} --end ${{ matrix.day }} --out data/backfill_part --have data/backfill/runs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bf-${{ matrix.day }}
          path: |
            data/backfill_part/runs/
            data/backfill_part/status_*.json
          if-no-files-found: warn
          retention-days: 7

  collect:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # latest main, not the commit that started the run (avoids index.json conflicts)
      - uses: actions/download-artifact@v4
        with:
          pattern: bf-*
          merge-multiple: true
          path: data/backfill_new
      - name: Merge, index, commit
        run: bash backfill_commit.sh
