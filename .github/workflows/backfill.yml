name: Backfill last winter

# Rebuilds historical IFS ENS runs (00Z + 12Z) with the same pipeline as the live job, in parallel chunks.
# Output: data/backfill/runs/*.json + data/backfill/index.json. The live sheet does NOT read these.
# Default range Nov 1 2025 – Mar 31 2026 (~300 runs, ~3–5 hours wall time, free on a public repo).

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date YYYYMMDD"
        required: true
        default: "20251101"
      end:
        description: "Last date YYYYMMDD"
        required: true
        default: "20260331"
      chunk_days:
        description: "Days per parallel job (5 = ~10 runs, ~2 h)"
        required: true
        default: "5"

permissions:
  contents: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.mk.outputs.chunks }}
    steps:
      - id: mk
        env:
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end }}
          CHUNK: ${{ github.event.inputs.chunk_days }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime, timedelta
          d = datetime.strptime(os.environ["START"], "%Y%m%d"); e = datetime.strptime(os.environ["END"], "%Y%m%d")
          n = int(os.environ["CHUNK"]); out = []
          while d <= e:
              z = min(e, d + timedelta(days=n - 1))
              out.append({"start": d.strftime("%Y%m%d"), "end": z.strftime("%Y%m%d")})
              d = z + timedelta(days=1)
          print("chunks=" + json.dumps(out))
          EOF

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build runs ${{ matrix.chunk.start }}–${{ matrix.chunk.end }}
        run: python backfill.py --start ${{ matrix.chunk.start }} --end ${{ matrix.chunk.end }} --out data/backfill_part
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bf-${{ matrix.chunk.start }}
          path: |
            data/backfill_part/runs/
            data/backfill_part/status_*.json
          if-no-files-found: warn
          retention-days: 7

  collect:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bf-*
          merge-multiple: true
          path: data/backfill
      - name: Index + summary
        run: |
          python3 - <<'EOF'
          import json, glob, os
          runs = []
          for f in sorted(glob.glob("data/backfill/runs/*.json")):
              j = json.load(open(f))
              runs.append({"init_utc": j["init_utc"], "cycle": j["cycle"], "file": "runs/" + os.path.basename(f),
                           "available_utc": j.get("available_utc"), "n_dates": len(j["dates"]), "members": j["members"]})
          failed = []
          for f in glob.glob("data/backfill/status_*.json"):
              failed += json.load(open(f))["failed"]
          json.dump({"runs": runs, "failed": sorted(failed)}, open("data/backfill/index.json", "w"), indent=1)
          print(f"{len(runs)} runs collected, {len(failed)} failed: {sorted(failed)[:40]}")
          EOF
      - name: Commit
        run: |
          git config user.name "ifs-bot"
          git config user.email "ifs-bot@users.noreply.github.com"
          git add data/backfill
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "Backfill: historical IFS ENS runs"
            for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep 10; done
          fi
