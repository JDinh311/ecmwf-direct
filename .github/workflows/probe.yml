name: ECMWF release probe

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Run probe
        run: python probe.py

      - name: Commit log if changed
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add data/probe_log.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "probe: new release times"
            git pull --rebase --autostash
            git push
          fi
