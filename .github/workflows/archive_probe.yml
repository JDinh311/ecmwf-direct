name: Archive probe

# One-off check: which past ECMWF runs are still on the AWS mirror (for the last-winter backtest),
# plus an attempt to download hourly NG futures prices. Writes data/archive_probe.json.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Probe archive and prices
        run: python archive_probe.py

      - name: Commit results
        run: |
          git config user.name "ifs-bot"
          git config user.email "ifs-bot@users.noreply.github.com"
          git add data/archive_probe.json data/prices || true
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "Archive probe results"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep 5
            done
          fi
