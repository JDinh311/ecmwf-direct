name: NG contract prices

# Daily NG futures settles, contracts 1-4 (EIA), for the swing backtest. Start by pushing requests/prices.txt: "Y0 Y1"
on:
  push:
    paths: ["requests/prices.txt"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pandas xlrd
      - run: python eia_prices.py
      - name: Commit
        run: |
          git config user.name "ifs-bot"; git config user.email "ifs-bot@users.noreply.github.com"
          git add data/prices/eia_ng_contracts.csv
          git commit -q -m "NG contract daily prices" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 10; done
